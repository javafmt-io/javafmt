# The corpus gate's ceiling: how many java.base files javafmt still gets wrong. Lower a number in
# the same commit as the fix that earns it; CorpusGateTest fails either way, so a run that comes in
# below a recorded value is as loud as one that comes in above and the file cannot drift.
#
# Recorded against Temurin 25.0.5, all of java.base. src.zip carries each platform's own sources, so
# a key suffixed .linux or .mac overrides the plain key on that operating system.
#
# files         the denominator every other count is read against
# unparseable   javafmt's own parser rejected the file
# refused       the round-trip verifier caught the renderer changing more than layout
# notReparsing  javafmt wrote output javac cannot read; the verifier missed it. Belongs at zero.
# notIdempotent format(format(x)) != format(x)
# overWidth     files carrying at least one line past the 150-character width
files.linux=3407
files.mac=3379
unparseable=0
refused=9
notReparsing=0
notIdempotent=0
overWidth.linux=79
overWidth.mac=78
