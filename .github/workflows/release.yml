name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  native:
    uses: ./.github/workflows/native.yml
    secrets: inherit

  release:
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NATIVE_CHECKSUMS: ${{ github.workspace }}/build/release-assets/native/SHA256SUMS

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java, Gradle and Node.js
        uses: ./.github/actions/setup-build
        with:
          node: 'true'
          source-date-epoch: 'true'
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Download native binaries
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: build/release-assets/native
          merge-multiple: true

      - name: Download VS Code extensions
        uses: actions/download-artifact@v8
        with:
          pattern: vsix-*
          path: build/release-assets/vsix
          merge-multiple: true

      - name: Checksum native binaries
        working-directory: build/release-assets/native
        run: |
          sha256sum javafmt-* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload native checksums
        uses: actions/upload-artifact@v7
        with:
          name: release-checksums
          path: build/release-assets/native/SHA256SUMS

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Build and test
        run: xvfb-run -a gradle build :javafmt-intellij:buildPlugin -Pjavafmt.nativeChecksums="$NATIVE_CHECKSUMS"

      - name: Resolve JReleaser and project versions
        run: |
          echo "JRELEASER_VERSION=$(sed -n 's/^jreleaser=//p' .sdkmanrc | tr -d '\r')" >> "$GITHUB_ENV"
          echo "JRELEASER_PROJECT_VERSION=$(gradle -q currentVersion)" >> "$GITHUB_ENV"

      - name: Stage the IntelliJ plugin
        run: |
          plugin=(javafmt-intellij/build/distributions/*.zip)
          [ -f "${plugin[0]}" ]
          cp "${plugin[0]}" "build/release-assets/javafmt-intellij-${JRELEASER_PROJECT_VERSION}.zip"

      - name: Publish to local staging
        run: gradle publishAllPublicationsToStagingRepository
        env:
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}

      - name: Release with JReleaser
        uses: jreleaser/release-action@v2
        with:
          version: ${{ env.JRELEASER_VERSION }}
          arguments: full-release --output-directory build
          setup-java: false
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_DEPLOY_MAVEN_MAVENCENTRAL_CENTRAL_USERNAME: ${{ secrets.MC_USERNAME }}
          JRELEASER_DEPLOY_MAVEN_MAVENCENTRAL_CENTRAL_PASSWORD: ${{ secrets.MC_TOKEN }}

      - name: Upload JReleaser output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jreleaser-output
          path: |
            build/jreleaser/trace.log
            build/jreleaser/output.properties

  publish-gradle-plugin:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-build
        with:
          source-date-epoch: 'true'
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Publish the Gradle plugin to the Plugin Portal
        run: gradle :javafmt-gradle-plugin:publishPlugins
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

  publish-intellij-plugin:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NATIVE_CHECKSUMS: ${{ github.workspace }}/build/release-assets/native/SHA256SUMS
      JETBRAINS_CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
      JETBRAINS_PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
      JETBRAINS_PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
      JETBRAINS_PLUGIN_TOKEN: ${{ secrets.JETBRAINS_PLUGIN_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java and Gradle
        uses: ./.github/actions/setup-build
        with:
          source-date-epoch: 'true'
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Download native checksums
        uses: actions/download-artifact@v8
        with:
          name: release-checksums
          path: build/release-assets/native

      - name: Sign the IntelliJ plugin
        run: gradle :javafmt-intellij:signPlugin -Pjavafmt.nativeChecksums="$NATIVE_CHECKSUMS"

      - name: Upload the signed IntelliJ plugin
        uses: actions/upload-artifact@v7
        with:
          name: intellij-plugin-signed
          path: javafmt-intellij/build/distributions/*-signed.zip
          if-no-files-found: error

      - name: Publish the IntelliJ plugin to the JetBrains Marketplace
        run: gradle :javafmt-intellij:publishPlugin -Pjavafmt.nativeChecksums="$NATIVE_CHECKSUMS"

  publish-vscode-extension:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java, Gradle and Node.js
        uses: ./.github/actions/setup-build
        with:
          node: 'true'
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Download VS Code extensions
        uses: actions/download-artifact@v8
        with:
          pattern: vsix-*
          path: build/release-assets/vsix
          merge-multiple: true

      - name: Publish to the Visual Studio Marketplace
        run: gradle :javafmt-vscode:publishMarketplace -Pjavafmt.vsixDirectory="$GITHUB_WORKSPACE/build/release-assets/vsix"

      - name: Publish to Open VSX
        if: ${{ !cancelled() }}
        run: gradle :javafmt-vscode:publishOpenVsx -Pjavafmt.vsixDirectory="$GITHUB_WORKSPACE/build/release-assets/vsix"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
