name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache node_modules and VS Code test binary
        uses: actions/cache@v4
        with:
          path: |
            javafmt-vscode/node_modules
            javafmt-vscode/.vscode-test
          key: npm-vscode-${{ runner.os }}-${{ hashFiles('javafmt-vscode/package.json') }}

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Build
        run: xvfb-run -a gradle build

  publish-snapshot:
    needs: build
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request'
        && github.event.pull_request.draft == false
        && github.event.pull_request.author_association == 'OWNER')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Compute snapshot version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=0.0.0-pr${{ github.event.pull_request.number }}-SNAPSHOT" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Packages
        run: |
          if [ -n "${{ steps.version.outputs.value }}" ]; then
            gradle -Pversion=${{ steps.version.outputs.value }} \
              publishAllPublicationsToGithubRepository
          else
            gradle publishAllPublicationsToGithubRepository
          fi
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
