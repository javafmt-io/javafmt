name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25.0.5'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Cache node_modules and VS Code test binary
        uses: actions/cache@v4
        with:
          path: |
            javafmt-vscode/node_modules
            javafmt-vscode/.vscode-test
          key: npm-vscode-${{ runner.os }}-${{ hashFiles('javafmt-vscode/package.json') }}

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Build
        run: xvfb-run -a gradle build

      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          check_name: Test results
          detailed_summary: true
          annotate_only: ${{ github.event.pull_request.head.repo.fork == true }}

      - name: Coverage summary
        run: cat build/reports/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            */build/reports/tests/
            */build/reports/jacoco/
          if-no-files-found: ignore

      - name: SonarQube Cloud analysis
        if: ${{ success() && env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8.4.0

  native:
    uses: ./.github/workflows/native.yml
    secrets: inherit

