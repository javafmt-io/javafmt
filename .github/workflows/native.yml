name: Native

on:
  workflow_dispatch:
  workflow_call:

# Builds platform-specific native binaries for javafmt-cli, which also serves the editor
# integrations through `javafmt --daemon`, and the VS Code extension that bundles each one.
# release.yml calls this workflow and attaches what it uploads to the GitHub Release.
# GraalVM cannot cross-compile, so each OS/arch runs its own job.
#
# First-time setup: before this workflow can succeed, the GraalVM tracing agent
# must be run locally to collect reflection metadata:
#
#   gradle -Pagent :javafmt-cli:test
#   gradle :javafmt-cli:metadataCopy --task test \
#     --dir javafmt-cli/src/main/resources/META-INF/native-image/io.javafmt/javafmt-cli
#
# Commit the generated metadata, then re-trigger this workflow. This metadata is already
# committed; the daemon's protobuf messages in javafmt-daemon's daemon.proto are registered by
# hand, so add any message or enum added there.

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win32-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          native-image-job-reports: 'true'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Compile CLI native binary
        run: gradle :javafmt-cli:nativeCompile

      # The native binary's whole point is starting instantly, and nothing measured it before.
      # Ten runs of the smallest possible input, so the number is startup rather than formatting.
      - name: Measure native cold start
        if: runner.os != 'Windows'
        shell: bash
        run: |
          binary=javafmt-cli/build/native/nativeCompile/javafmt
          echo 'class A{}' > /tmp/cold-start.java
          echo "class A{}" | "$binary" > /dev/null
          start=$(date +%s%N)
          for _ in $(seq 1 10); do
            "$binary" < /tmp/cold-start.java > /dev/null
          done
          end=$(date +%s%N)
          echo "native cold start: $(( (end - start) / 10000000 )).$(( ((end - start) / 1000000) % 10 )) ms per run (10 runs)"

      # A binary that starts fast and formats wrongly still passes cold-start timing. Assert
      # actual output: plain formatting, and the --diagnostics=json stream staying on stdout with
      # nothing on stderr for clean input.
      - name: Smoke test the CLI binary
        shell: bash
        run: |
          binary=javafmt-cli/build/native/nativeCompile/javafmt
          [ -f "$binary" ] || binary=javafmt-cli/build/native/nativeCompile/javafmt.exe
          "$binary" --version
          printf 'class A{int x=1;}\n' | "$binary" | grep -q 'int x = 1;'
          printf 'class A{int x=1;}\n' | "$binary" --diagnostics=json 2>/tmp/err.txt | grep -q 'int x = 1;'
          [ ! -s /tmp/err.txt ]

      - name: Smoke test the CLI daemon
        run: gradle :javafmt-cli:nativeDaemonTest

      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Package the VS Code extension for this platform
        run: gradle :javafmt-vscode:packageVsixTarget
        env:
          VSCE_TARGET: ${{ matrix.target }}

      - name: Stage release assets
        shell: bash
        run: |
          version=$(gradle -q currentVersion)
          binary=javafmt-cli/build/native/nativeCompile/javafmt
          suffix=''
          if [ -f "$binary.exe" ]; then binary="$binary.exe"; suffix='.exe'; fi
          mkdir -p staged/native staged/vsix
          cp "$binary" "staged/native/javafmt-$version-${{ matrix.target }}$suffix"
          vsix=(javafmt-vscode/*.vsix)
          [ -f "${vsix[0]}" ]
          cp "${vsix[0]}" "staged/vsix/javafmt-vscode-$version-${{ matrix.target }}.vsix"

      - name: Upload native binary
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.target }}
          path: staged/native/
          if-no-files-found: error

      - name: Upload VS Code extension
        uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.target }}
          path: staged/vsix/
          if-no-files-found: error
