version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      gradle:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - /javafmt-vscode
      - /website
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
    ignore:
      - dependency-name: "@types/vscode"
