# The llm-build-compactor plugin stops JavaCompile tasks forking, so Error Prone runs inside the
# Gradle daemon and needs jdk.compiler's internals exported to it there. Without these the build
# fails with IllegalAccessError in BaseErrorProneJavaCompiler. javafmt itself needs none of them.
org.gradle.jvmargs=-Xmx2g -XX:+HeapDumpOnOutOfMemoryError --add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-opens jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
